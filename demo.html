
<!DOCTYPE html>

        .demo-content h2 {
            color: #1F2937;
            margin-bottom: 24px;
        }

        .config-section {
            background: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .config-section h3 {
            color: #374151;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-section code {
            display: block;
            background: #1F2937;
            color: #10B981;

            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
            line-height: 1.6;
        }

</head>
<body>
            <div class="config-section">
                <h3>📝 Código de Instalação</h3>
                <code>&lt;script src="widget.js"&gt;&lt;/script&gt;
&lt;script&gt;
  FeedFlowWidget.init({
    apiToken: '<span id="display-token">seu-token-aqui</span>',
    apiUrl: '<span id="display-url">http://localhost:8000</span>',
    buttonText: 'Reportar Problema',
    buttonPosition: 'bottom-right',
    primaryColor: '#4F46E5'
  });
&lt;/script&gt;</code>
            </div>

           
        </div>

        
    </div>

    <!-- Importar o widget -->
    <script src="widget.js"></script>
    
    <script>
        function initializeWidget() {
            const token = document.getElementById('api-token').value.trim();
            const url = document.getElementById('api-url').value.trim();

            if (!token) {
                alert('Por favor, insira um API Token!');
                return;
            }

            if (!url) {
                alert('Por favor, insira uma API URL!');
                return;
            }

            // Atualizar display
            document.getElementById('display-token').textContent = token;
            document.getElementById('display-url').textContent = url;

            // Inicializar widget
            try {
                FeedFlowWidget.init({
                    apiToken: token,
                    apiUrl: url,
                    buttonText: 'Reportar Problema',
                    buttonPosition: 'bottom-right',
                    primaryColor: '#667eea'
                });

                alert('✅ Widget inicializado! Procure o botão no canto da tela.');
            } catch (error) {
                alert('Erro ao inicializar widget: ' + error.message);
            }
        }

        // Auto-inicializar se houver token salvo
        window.addEventListener('load', function() {
            const savedToken = localStorage.getItem('feedflow_demo_token');
            const savedUrl = localStorage.getItem('feedflow_demo_url');
            
            if (savedToken) {
                document.getElementById('api-token').value = savedToken;
            }
            
            if (savedUrl) {
                document.getElementById('api-url').value = savedUrl;
            }
        });

        // Salvar configurações
        document.getElementById('api-token').addEventListener('input', function(e) {
            localStorage.setItem('feedflow_demo_token', e.target.value);
        });

        document.getElementById('api-url').addEventListener('input', function(e) {
            localStorage.setItem('feedflow_demo_url', e.target.value);
        });

        // ==================== AUTH FUNCTIONS ====================
        const API_URL = 'http://localhost:8000';
        let currentToken = null;

        function switchAuthTab(tab) {
            // Update tabs
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById(tab + '-form').classList.add('active');

            // Clear result
            hideAuthResult();
        }

        function showAuthResult(message, isSuccess) {
            const result = document.getElementById('auth-result');
            result.textContent = message;
            result.className = 'auth-result ' + (isSuccess ? 'success' : 'error');
            result.style.display = 'block';
        }

        function hideAuthResult() {
            document.getElementById('auth-result').style.display = 'none';
        }

        function showUserInfo(user) {
            document.getElementById('user-id').textContent = user.id;
            document.getElementById('user-email').textContent = user.email;
            document.getElementById('user-info').style.display = 'block';
            document.querySelectorAll('.auth-form').forEach(f => f.style.display = 'none');
            document.querySelectorAll('.auth-tab').forEach(t => t.style.display = 'none');
        }

        function hideUserInfo() {
            document.getElementById('user-info').style.display = 'none';
            document.querySelectorAll('.auth-form').forEach(f => f.style.display = 'block');
            document.querySelectorAll('.auth-tab').forEach(t => t.style.display = 'block');
        }

        async function handleRegister(event) {
            event.preventDefault();
            hideAuthResult();

            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const btn = document.getElementById('register-btn');
            const btnText = document.getElementById('register-btn-text');

            // Desabilita botão e mostra spinner
            btn.disabled = true;
            btnText.innerHTML = 'Criando conta<span class="spinner"></span>';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    currentToken = data.access_token;
                    localStorage.setItem('feedflow_token', currentToken);
                    showAuthResult('✅ Conta criada com sucesso!', true);
                    showUserInfo(data.user);
                } else {
                    showAuthResult((data.error || data.detail || 'Erro ao criar conta'), false);
                }
            } catch (error) {
                showAuthResult('Erro ao criar conta: ' + error.message, false);
            } finally {
                // Reabilita botão e remove spinner
                btn.disabled = false;
                btnText.innerHTML = 'Criar Conta';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideAuthResult();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    currentToken = data.access_token;
                    localStorage.setItem('feedflow_token', currentToken);
                    showAuthResult('✅ Login realizado com sucesso!', true);
                    showUserInfo(data.user);
                } else {
                    showAuthResult((data.error || data.detail || 'Erro ao fazer login'), false);
                }
            } catch (error) {
                showAuthResult('Erro ao fazer login: ' + error.message, false);
            }
        }

        async function handleLogout() {
            try {
                await fetch(`${API_URL}/auth/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            currentToken = null;
            localStorage.removeItem('feedflow_token');
            hideUserInfo();
            hideAuthResult();
            showAuthResult('✅ Logout realizado!', true);
        }

        function connectSlack() {
            if (!currentToken) {
                alert('Faça login primeiro!');
                return;
            }

            const btn = document.getElementById('slack-btn');
            const btnText = document.getElementById('slack-btn-text');
            const statusDiv = document.getElementById('slack-status');

            // Desabilita botão e mostra loading
            btn.disabled = true;
            btnText.innerHTML = 'Conectando ao Slack<span class="spinner"></span>';
            statusDiv.textContent = 'Redirecionando para autenticação do Slack...';

            // Redirecionar para OAuth do Slack
            setTimeout(() => {
                window.location.href = `${API_URL}/auth/slack/install`;
            }, 500);
        }

        // Restaurar status do Slack ao voltar
        window.addEventListener('focus', function() {
            const btn = document.getElementById('slack-btn');
            const btnText = document.getElementById('slack-btn-text');
            const statusDiv = document.getElementById('slack-status');

            if (btn.disabled) {
                btn.disabled = false;
                btnText.innerHTML = '🔗 Conectar Slack';
                statusDiv.innerHTML = '<span style="color: #10B981;">✅ Slack conectado com sucesso!</span>' || '';
            }
        });

        // Check if user is already logged in
        window.addEventListener('load', async function() {
            const savedToken = localStorage.getItem('feedflow_token');
            
            if (savedToken) {
                try {
                    const response = await fetch(`${API_URL}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${savedToken}` }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        currentToken = savedToken;
                        showUserInfo(data.user);
                    } else {
                        localStorage.removeItem('feedflow_token');
                    }
                } catch (error) {
                    console.error('Token validation error:', error);
                    localStorage.removeItem('feedflow_token');
                }
            }
        });
    </script>
</body>
</html>
