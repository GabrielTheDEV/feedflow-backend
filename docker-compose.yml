
services:
  # Backend FastAPI
  backend:
    build: ./backend
    container_name: feedflow_backend
    environment:
      # UPLOAD_DIR: /app/uploads/screenshots
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8000
      USE_SUPABASE: "true"
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - feedflow_network
    restart: unless-stopped

  # ngrok tunnel for OAuth (HTTPS)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: feedflow_ngrok
    command: http backend:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - backend
    networks:
      - feedflow_network
    restart: unless-stopped

volumes:
  uploads_data:
    driver: local

networks:
  feedflow_network:
    driver: bridge
